[project]
name = "hackathon"
version = "0.1.0"
description = "Country facts guessing game (NiceGUI)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
